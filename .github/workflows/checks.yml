name: Checks

# Runs when you push edits to a draft PR: re-renders changed diagrams and re-checks the post.
on:
  pull_request:
    paths:
      - "posts/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: checks-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Find changed post folders
        id: changed
        run: |
          folders=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- posts/ \
                    | awk -F/ 'NF>=3 {print $1"/"$2}' | sort -u | while read -r f; do [ -f "$f/post.md" ] && echo "$f"; done | tr '\n' ' ')
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
          echo "Changed: $folders"

      - name: Render diagrams
        if: steps.changed.outputs.folders != ''
        run: |
          mkdir -p .work
          bash scripts/render.sh ${{ steps.changed.outputs.folders }} 2>&1 | tee .work/render.log
          if [ -n "$(git status --porcelain posts/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts
            git commit -m "Render diagrams"
            git push
          fi

      - name: Check posts against the playbook
        if: steps.changed.outputs.folders != ''
        env:
          SANITIZE_DENYLIST: ${{ secrets.SANITIZE_DENYLIST }}
        working-directory: scripts
        run: |
          args=""
          for f in ${{ steps.changed.outputs.folders }}; do args="$args ../$f"; done
          python validate_post.py $args 2>&1 | tee ../.work/validate.log

      - name: Report on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDERS: ${{ steps.changed.outputs.folders }}
          OUTCOME: ${{ job.status }}
        run: |
          mkdir -p .work
          sha=$(git rev-parse HEAD)
          {
            if [ "$OUTCOME" = "success" ]; then echo "**Checks passed.**"; else echo "**Checks failed.**"; fi
            echo
            echo "Post folders checked: ${FOLDERS:-none}"
            for f in $FOLDERS; do
              for img in diagram.png; do
                [ -f "$f/$img" ] && echo && echo "![${f##*/}](${{ github.server_url }}/${{ github.repository }}/blob/$sha/$f/$img?raw=true)"
              done
              [ -f "$f/carousel.pdf" ] && echo && echo "Carousel: ${{ github.server_url }}/${{ github.repository }}/blob/$sha/$f/carousel.pdf"
            done
            for log in .work/render.log .work/validate.log; do
              [ -s "$log" ] || continue
              echo; echo "<details><summary>${log#.work/}</summary>"; echo; echo '```'; tail -40 "$log"; echo '```'; echo "</details>"
            done
            echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > .work/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file .work/comment.md
